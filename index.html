      { name: "1058 Series 20 GA", type: "Metal", cost: 2035, discount: 610.5, discountPct: 0.3, netCost: 1424.5, tax: 175.6205, totalCost: 1600.1205, retail: 3195, margin: 1594.8795 },
      { name: "Valencia 20 GA", type: "Metal", cost: 1620, discount: 486, discountPct: 0.3, netCost: 1134, tax: 139.806, totalCost: 1273.806, retail: 2895, margin: 1621.194 },

      { name: "Baron/85 20 GA Non Gasket", type: "Metal", cost: 1235, discount: 652, discountPct: 0.5279352226720648, netCost: 583, tax: 50.3129, totalCost: 633.3129, retail: 1995, margin: 1361.6871 }
    ];

    // Creating the main App component
    function App() {
      const [caskets, setCaskets] = React.useState(initialCaskets);
      const [selectedCasketIndex, setSelectedCasketIndex] = React.useState(null);
      const [desiredMarginPct, setDesiredMarginPct] = React.useState(51.64); // Default to original average margin

      // Handling margin percentage input change
      const handleMarginChange = (e) => {
        const value = parseFloat(e.target.value);
        if (!isNaN(value) && value >= 0 && value <= 100 && selectedCasketIndex !== null) {
          setDesiredMarginPct(value);
          // Updating only the selected casket
          const updatedCaskets = caskets.map((casket, index) => {
            if (index === selectedCasketIndex) {
              const desiredMarginDecimal = value / 100;
              // Retail = Total Cost / (1 - Desired Margin %)
              const newRetail = desiredMarginDecimal < 1 ? casket.totalCost / (1 - desiredMarginDecimal) : casket.totalCost * 2; // Prevent division by zero
              const newMargin = newRetail - casket.totalCost;
              return { ...casket, retail: Math.round(newRetail * 100) / 100, margin: Math.round(newMargin * 100) / 100 };
            }
            return casket;
          });
          setCaskets(updatedCaskets);
        }
      };

      // Handling casket selection
      const handleCasketSelect = (index) => {
        setSelectedCasketIndex(index);
        // Reset margin to the selected casket's original margin
        const selectedCasket = caskets[index];
        const originalMarginPct = (selectedCasket.margin / selectedCasket.retail) * 100;
        setDesiredMarginPct(originalMarginPct);
      };

      // Rendering the UI
      return (
        <div className="container mx-auto p-6">
          <h1 className="text-3xl font-bold mb-6 text-center text-gray-800">Casket Pricing Tool</h1>

          {/* Original 2022 Pricing Table */}

          <div className="overflow-x-auto mb-12">
            <table className="min-w-full bg-white border rounded-lg shadow-lg">
              <thead>
                <tr className="bg-gray-600 text-white">
                  <th className="p-3 text-left">Casket Name</th>
                  <th className="p-3 text-left">Type</th>
                  <th className="p-3 text-right">Cost ($)</th>
                  <th className="p-3 text-right">Discount ($)</th>
                  <th className="p-3 text-right">Discount %</th>
                  <th className="p-3 text-right">NET Cost ($)</th>
                  <th className="p-3 text-right">Tax ($)</th>
                  <th className="p-3 text-right">Total Cost ($)</th>
                  <th className="p-3 text-right">Retail ($)</th>
                  <th className="p-3 text-right">Margin ($)</th>
                  <th className="p-3 text-right">Margin %</th>
                </tr>
              </thead>
              <tbody>
                {initialCaskets.map((casket, index) => (
                  <tr key={index} className={index % 2 === 0 ? 'bg-gray-50' : 'bg-white'}>
                    <td className="p-3">{casket.name}</td>
                    <td className="p-3">{casket.type}</td>
                    <td className="p-3 text-right">{casket.cost.toFixed(2)}</td>
                    <td className="p-3 text-right">{casket.discount.toFixed(2)}</td>
                    <td className="p-3 text-right">{(casket.discountPct * 100).toFixed(2)}%</td>
                    <td className="p-3 text-right">{casket.netCost.toFixed(2)}</td>
                    <td className="p-3 text-right">{casket.tax.toFixed(2)}</td>
                    <td className="p-3 text-right">{casket.totalCost.toFixed(2)}</td>
                    <td className="p-3 text-right font-semibold">{casket.retail.toFixed(2)}</td>
                    <td className="p-3 text-right">{casket.margin.toFixed(2)}</td>
                    <td className="p-3 text-right">{((casket.margin / casket.retail) * 100).toFixed(2)}%</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Interactive Pricing Adjuster Table */}
          <h2 className="text-2xl font-semibold mb-4 text-gray-700">Adjustable Casket Pricing (Single Casket)</h2>
          <div className="mb-6 flex justify-center items-center">
            <label className="mr-4 text-lg text-gray-700 flex items-center">
              Desired Margin (%):
              <input
                type="range"
                min="0"
                max="100"
                step="0.1"
                value={desiredMarginPct}
                onChange={handleMarginChange}
                className="ml-2 w-48"
                disabled={selectedCasketIndex === null}
              />
              <span className="ml-2">{desiredMarginPct.toFixed(1)}%</span>
            </label>
            <input
              type="number"
              value={desiredMarginPct}
              onChange={handleMarginChange}
              className="p-2 border rounded w-24"
              min="0"
              max="100"
              step="0.1"
              disabled={selectedCasketIndex === null}
            />
          </div>
          <div className="overflow-x-auto">
            <table className="min-w-full bg-white border rounded-lg shadow-lg">
              <thead>
                <tr className="bg-blue-600 text-white">
                  <th className="p-3 text-center">Select</th>
                  <th className="p-3 text-left">Casket Name</th>
                  <th className="p-3 text-left">Type</th>
                  <th className="p-3 text-right">Cost ($)</th>
                  <th className="p-3 text-right">Discount ($)</th>
                  <th className="p-3 text-right">Discount %</th>
                  <th className="p-3 text-right">NET Cost ($)</th>
                  <th className="p-3 text-right">Tax ($)</th>
                  <th className="p-3 text-right">Total Cost ($)</th>
                  <th className="p-3 text-right">Retail ($)</th>
                  <th className="p-3 text-right">Margin ($)</th>
                  <th className="p-3 text-right">Margin %</th>
                </tr>
              </thead>
              <tbody>
                {caskets.map((casket, index) => (
                  <tr
                    key={index}
                    className={`${index % 2 === 0 ? 'bg-gray-50' : 'bg-white'} ${selectedCasketIndex === index ? 'bg-blue-100' : ''}`}
                  >
                    <td className="p-3 text-center">
                      <input
                        type="radio"
                        name="casketSelect"
                        checked={selectedCasketIndex === index}
                        onChange={() => handleCasketSelect(index)}
                      />
                    </td>
                    <td className="p-3">{casket.name}</td>
                    <td className="p-3">{casket.type}</td>
                    <td className="p-3 text-right">{casket.cost.toFixed(2)}</td>
                    <td className="p-3 text-right">{casket.discount.toFixed(2)}</td>
                    <td className="p-3 text-right">{(casket.discountPct * 100).toFixed(2)}%</td>
                    <td className="p-3 text-right">{casket.netCost.toFixed(2)}</td>
                    <td className="p-3 text-right">{casket.tax.toFixed(2)}</td>
                    <td className="p-3 text-right">{casket.totalCost.toFixed(2)}</td>
                    <td className="p-3 text-right font-semibold">{casket.retail.toFixed(2)}</td>
                    <td className="p-3 text-right">{casket.margin.toFixed(2)}</td>
                    <td className="p-3 text-right">{((casket.margin / casket.retail) * 100).toFixed(2)}%</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {selectedCasketIndex === null && (
            <p className="mt-4 text-center text-gray-600">Please select a casket to adjust its margin.</p>
          )}
        </div>
      );
    }

    // Rendering the App component
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
